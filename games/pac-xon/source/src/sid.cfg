MEMORY {
    ZP:     file = "", start = $0002, size = $001a, define = yes;
    HEADER: file = %O, start = $0000, size = $007c;
    MUSIC:  file = %O, start = $1000, size = $4000;
}
SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    ENTRY:    load = MUSIC,  type = ro;
    CODE:     load = MUSIC,  type = ro;
    RODATA:   load = MUSIC,  type = ro;
    DATA:     load = MUSIC,  type = rw;
    BSS:      load = MUSIC,  type = rw;
}
